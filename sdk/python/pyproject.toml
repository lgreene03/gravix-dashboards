[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravix"
version = "0.1.0"
description = "Python client for the Gravix observability platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.20",
]

[project.optional-dependencies]
flask = ["flask>=2.0"]
fastapi = ["fastapi>=0.68", "starlette>=0.14"]
django = ["django>=3.2"]
dev = ["pytest>=7.0", "responses>=0.20"]

[tool.setuptools.packages.find]
include = ["gravix*"]
