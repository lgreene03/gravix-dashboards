{{/*
  cert-manager ClusterIssuer for automated TLS certificate provisioning.

  Prerequisites:
    1. Install cert-manager:
       helm install cert-manager jetstack/cert-manager \
         --namespace cert-manager --create-namespace \
         --set crds.enabled=true

    2. Ensure your domain's DNS A/CNAME record points to the ingress
       controller's external IP before enabling.

  The staging issuer is useful for testing without hitting Let's Encrypt
  rate limits. Switch to the production issuer once verified.
*/}}
{{- if .Values.certManager.enabled }}

# ─── Let's Encrypt Production Issuer ───
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.issuerName | default "letsencrypt-prod" }}
  labels:
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ required "certManager.email is required when certManager is enabled" .Values.certManager.email }}
    privateKeySecretRef:
      name: {{ .Values.certManager.issuerName | default "letsencrypt-prod" }}-account-key
    solvers:
      {{- if .Values.certManager.solver }}
      {{- toYaml .Values.certManager.solver | nindent 6 }}
      {{- else }}
      - http01:
          ingress:
            class: {{ .Values.ingress.className | default "nginx" }}
      {{- end }}

# ─── Let's Encrypt Staging Issuer (for testing) ───
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.issuerName | default "letsencrypt-prod" }}-staging
  labels:
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ .Values.certManager.email }}
    privateKeySecretRef:
      name: {{ .Values.certManager.issuerName | default "letsencrypt-prod" }}-staging-account-key
    solvers:
      {{- if .Values.certManager.solver }}
      {{- toYaml .Values.certManager.solver | nindent 6 }}
      {{- else }}
      - http01:
          ingress:
            class: {{ .Values.ingress.className | default "nginx" }}
      {{- end }}

{{- end }}
