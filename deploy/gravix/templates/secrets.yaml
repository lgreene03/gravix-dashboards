{{/*
  Inline Helm-managed Secret. Skipped when External Secrets Operator is managing secrets.
  In production, prefer externalSecrets.enabled=true so secrets never touch Helm values.
*/}}
{{- if not .Values.externalSecrets.enabled }}

{{- if not .Values.global.apiKey }}
  {{- fail "global.apiKey is required. Set it via --set global.apiKey=<value> or a values override file. Or enable externalSecrets.enabled=true to use an external provider." }}
{{- end }}
{{- if not .Values.global.storage.accessKey }}
  {{- fail "global.storage.accessKey is required. Set it via --set global.storage.accessKey=<value>. Or enable externalSecrets.enabled=true." }}
{{- end }}
{{- if not .Values.global.storage.secretKey }}
  {{- fail "global.storage.secretKey is required. Set it via --set global.storage.secretKey=<value>. Or enable externalSecrets.enabled=true." }}
{{- end }}

{{/* Warn on weak secrets — must be at least 16 characters */}}
{{- if lt (len .Values.global.apiKey) 16 }}
  {{- fail "global.apiKey must be at least 16 characters for production use." }}
{{- end }}
{{- if lt (len .Values.global.storage.accessKey) 8 }}
  {{- fail "global.storage.accessKey must be at least 8 characters." }}
{{- end }}
{{- if lt (len .Values.global.storage.secretKey) 16 }}
  {{- fail "global.storage.secretKey must be at least 16 characters for production use." }}
{{- end }}

{{/* JWT secret is required for gateway authentication */}}
{{- if not .Values.global.jwtSecret }}
  {{- fail "global.jwtSecret is required for JWT authentication. Set it via --set global.jwtSecret=<value> (minimum 32 characters). Or enable externalSecrets.enabled=true." }}
{{- end }}
{{- if lt (len .Values.global.jwtSecret) 32 }}
  {{- fail "global.jwtSecret must be at least 32 characters for production security." }}
{{- end }}

{{/* Cube.js API secret is mandatory in production */}}
{{- if not .Values.global.cubeApiSecret }}
  {{- fail "global.cubeApiSecret is required. Set it via --set global.cubeApiSecret=<value>. Or enable externalSecrets.enabled=true." }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Helm will not delete this secret on uninstall to prevent data loss
    "helm.sh/resource-policy": keep
type: Opaque
data:
  api-key: {{ .Values.global.apiKey | b64enc | quote }}
  s3-access-key: {{ .Values.global.storage.accessKey | b64enc | quote }}
  s3-secret-key: {{ .Values.global.storage.secretKey | b64enc | quote }}
  jwt-secret: {{ .Values.global.jwtSecret | b64enc | quote }}
  cube-api-secret: {{ .Values.global.cubeApiSecret | b64enc | quote }}
  {{- if .Values.global.databaseUrl }}
  database-url: {{ .Values.global.databaseUrl | b64enc | quote }}
  {{- end }}

{{- end }}
