# Iceberg read path for Gravix's warehouse — an ADDITIONAL catalog beside
# gravix.properties, which stays the primary and is unchanged.
#
# GRVX-1106 §5.1 asked for iceberg.catalog.type=hadoop. Trino 435 has no such
# type — its CatalogType enum is TESTING_FILE_METASTORE, HIVE_METASTORE, GLUE,
# REST, JDBC and NESSIE — so the catalog failed to load and took Trino down with
# it (SD-059). This uses Trino's file metastore, the same one gravix.properties
# uses, with its directory in the bucket rather than on Trino's disk. No
# metastore service is needed.
#
# What another engine needs is not the metastore but the table. With unique
# table locations off, each table lives at a fixed path,
# s3a://<bucket>/iceberg-warehouse/raw/<table>, and its metadata/ directory
# holds every metadata.json Trino has written. An Iceberg reader given the
# newest of them and the S3 credentials reads the table, which is what
# scripts/verify_spark_iceberg_read.sh does with Spark (DD-033).
connector.name=iceberg
iceberg.catalog.type=TESTING_FILE_METASTORE
hive.metastore.catalog.dir=s3a://${S3_BUCKET}/iceberg-warehouse
iceberg.unique-table-location=false
iceberg.file-format=PARQUET
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=${S3_ACCESS_KEY}
hive.s3.aws-secret-key=${S3_SECRET_KEY}
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false
