{{- if .Values.storage.cube.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cube
  labels:
    app: cube
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cube
  template:
    metadata:
      labels:
        app: cube
    spec:
      serviceAccountName: {{ .Release.Name }}-cube
      {{- include "gravix.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: cube
          image: "{{ .Values.storage.cube.image.repository }}:{{ .Values.storage.cube.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 4000
          env:
            - name: CUBEJS_DB_TYPE
              value: "trino"
            - name: CUBEJS_DB_HOST
              value: "{{ .Release.Name }}-trino"
            - name: CUBEJS_DB_PORT
              value: "8080"
            - name: CUBEJS_DB_PRESTO_CATALOG
              value: "gravix"
            - name: CUBEJS_DB_NAME
              value: "raw"
            - name: CUBEJS_DB_USER
              value: "trino"
            - name: CUBEJS_DEV_MODE
              value: "{{ .Values.storage.cube.devMode | default false }}"
            {{- if .Values.global.cubeApiSecret }}
            - name: CUBEJS_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: cube-api-secret
            {{- end }}
            {{- if .Values.global.jwtSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: jwt-secret
            {{- end }}
            # Memory, in every deployment. In production mode Cube's default is Cube
            # Store, which this chart does not run, and every query failed (F-074).
            # Cube removed Redis as a cache and queue driver in v0.36, so the redis
            # values no longer reach Cube (DD-034). Each replica keeps its own cache:
            # nothing declares a pre-aggregation (SD-024), so there is no rollup
            # for replicas to share, only cached results.
            - name: CUBEJS_CACHE_AND_QUEUE_DRIVER
              value: "memory"
            # DuckDB performance tuning (5.1): only effective when CUBEJS_DB_TYPE=duckdb.
            - name: CUBEJS_DB_MAX_POOL
              value: {{ .Values.storage.cube.duckdb.maxPoolSize | default 8 | quote }}
            - name: CUBEJS_DB_QUERY_TIMEOUT
              value: {{ .Values.storage.cube.duckdb.queryTimeoutSec | default 30 | quote }}
            - name: CUBEJS_CONCURRENCY
              value: {{ .Values.storage.cube.duckdb.threads | default 2 | quote }}
          livenessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cube
spec:
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: cube
{{- end }}
