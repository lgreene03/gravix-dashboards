syntax = "proto3";

package gravix.v1;

option go_package = "github.com/lgreene/gravix-dashboards/gen/gravix/v1;gravixv1";

import "google/protobuf/timestamp.proto";

// RequestFact represents a raw HTTP request event.
message RequestFact {
  string event_id = 1;
  google.protobuf.Timestamp event_time = 2;
  string service = 3;
  string method = 4;
  string path_template = 5;
  int32 status_code = 6;
  int32 latency_ms = 7;
  string user_agent_family = 8;
  string tenant_id = 9;
}

// TraceSample represents a sampled distributed trace span.
// Stored separately from RequestFact to avoid adding high-cardinality
// dimensions to the core fact table. Short retention (7 days).
message TraceSample {
  string trace_id = 1;                         // UUIDv7 — shared across all spans in a trace
  string span_id = 2;                          // 16-char lowercase hex
  string parent_span_id = 3;                   // empty for root span
  google.protobuf.Timestamp event_time = 4;    // when the span started
  string service = 5;
  string method = 6;                           // HTTP method
  string path_template = 7;                    // sanitized path template
  int32 status_code = 8;                       // HTTP status (100-599)
  int32 latency_ms = 9;                        // span duration in ms (>= 0)
  map<string, string> tags = 10;               // max 10 key-value pairs
}

// ServiceEvent represents a generic lifecycle or operational event.
message ServiceEvent {
  string event_id = 1;
  google.protobuf.Timestamp event_time = 2;
  string service = 3;
  string event_type = 4;
  string entity_id = 5; // Added
  string message = 6;
  map<string, string> properties = 7;
  string tenant_id = 8;
}

// ExternalMetricSample represents one pre-aggregated observation ingested
// from a foreign metrics protocol (Prometheus remote-write, OTLP metrics).
// Unlike RequestFact, it is NOT a Fact under docs/00-system-truth.md §1: it
// may contain derived/aggregated data, and gravix recompute never reads it.
// It exists so Prometheus- and OTLP-instrumented services can be visualised
// without an instrumentation change.
message ExternalMetricSample {
  string sample_id = 1;                        // UUIDv7, generated by the receiver
  google.protobuf.Timestamp sample_time = 2;
  string tenant_id = 3;
  string source = 4;                            // "prometheus_remote_write" | "otlp_metrics"
  string metric_name = 5;
  map<string, string> labels = 6;               // <= 20 entries; budgeted by pkg/cardinality
  double value = 7;
  string metric_type = 8;                       // "counter" | "gauge" | "histogram_bucket"
}
