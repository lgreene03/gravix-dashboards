{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gravix.fullname" . }}-ingestion
  labels:
    {{- include "gravix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ingestion
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept traffic from ingress controller and gateway
    - ports:
        - port: {{ .Values.ingestion.service.port }}
          protocol: TCP
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow S3/MinIO
    - ports:
        - port: 9000
          protocol: TCP
        - port: 443
          protocol: TCP
    # Allow metrics scraping
    - ports:
        - port: {{ .Values.ingestion.metricsPort | default 9090 }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gravix.fullname" . }}-gateway
  labels:
    {{- include "gravix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.gateway.service.port }}
          protocol: TCP
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow Cube.js
    - ports:
        - port: 4000
          protocol: TCP
    # Allow Stripe API (HTTPS)
    - ports:
        - port: 443
          protocol: TCP
    # Allow database
    - ports:
        - port: 5432
          protocol: TCP
{{- end }}
