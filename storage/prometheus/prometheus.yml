global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "ingestion"
    static_configs:
      - targets: ["ingestion:8080"]

  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8091"]

  - job_name: "request-metrics-rollup"
    static_configs:
      - targets: ["request-metrics-rollup:9090"]

  - job_name: "purge"
    static_configs:
      - targets: ["purge:9091"]

  - job_name: "service-events-rollup"
    static_configs:
      - targets: ["service-events-rollup:9092"]

  - job_name: "service-events-detail-rollup"
    static_configs:
      - targets: ["service-events-detail-rollup:9093"]
