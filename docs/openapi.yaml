openapi: 3.0.3
info:
  title: Gravix API
  description: |
    HTTP API for the Gravix observability platform.
    Accepts request facts and service lifecycle events for aggregation and visualization.
    Provides tenant management, authentication, billing, alerting, and audit capabilities.
  version: 0.1.0
  contact:
    name: Gravix
    url: https://github.com/lgreene03/gravix-dashboards
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8090
    description: Ingestion API (local)
  - url: http://localhost:8091
    description: Gateway API (local)

security:
  - apiKeyAuth: []

tags:
  - name: Data
    description: Ingest request facts and service events
  - name: Health
    description: Liveness, readiness, and metrics endpoints
  - name: Auth
    description: Registration, login, and user profile
  - name: APIKeys
    description: API key management
  - name: Billing
    description: Stripe billing and usage
  - name: Alerts
    description: Alert rules and alert history
  - name: Channels
    description: Notification channels
  - name: DLQ
    description: Dead-letter queue management
  - name: Audit
    description: Audit log
  - name: Metrics
    description: Derived metric queries whose correctness needs server-side computation

paths:
  # ── Ingestion endpoints ──────────────────────────────────────────────

  /api/v1/facts:
    post:
      operationId: ingestFact
      summary: Ingest a single request fact
      description: |
        Records a single HTTP request observation. The fact is validated,
        persisted to disk (fsync'd), and later rolled up into minute-level metrics.
      tags: [Data]
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestFact"
            example:
              event_id: "018f3a3b-2c5e-7a1d-8b4e-9f0a2c5b3d4e"
              event_time: "2024-05-01T12:00:00Z"
              service: "auth-service"
              method: "POST"
              path_template: "/api/v1/login"
              status_code: 200
              latency_ms: 125
              user_agent_family: "Chrome"
      responses:
        "201":
          description: Fact persisted to disk.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/facts/batch:
    post:
      operationId: ingestFactsBatch
      summary: Ingest request facts in batch (JSONL)
      description: |
        Records multiple request facts in a single request using JSONL
        (newline-delimited JSON) format. Each line is validated independently.
        Valid facts are persisted; invalid lines are reported in the response.
      tags: [Data]
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              description: Newline-delimited JSON (JSONL). Each line is a RequestFact object.
            example: |
              {"event_id":"018f3a3b-0001-7000-8000-000000000001","event_time":"2024-05-01T12:00:00Z","service":"auth-service","method":"GET","path_template":"/api/health","status_code":200,"latency_ms":5}
              {"event_id":"018f3a3b-0002-7000-8000-000000000002","event_time":"2024-05-01T12:00:01Z","service":"auth-service","method":"POST","path_template":"/api/v1/login","status_code":200,"latency_ms":125}
      responses:
        "200":
          description: Batch processed. Check accepted/rejected counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResult"
              example:
                accepted: 2
                rejected: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/events:
    post:
      operationId: ingestEvent
      summary: Ingest a service lifecycle event
      description: |
        Records a service lifecycle event such as a deploy, restart, scale operation,
        or health check failure. Events are persisted synchronously.
      tags: [Data]
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceEvent"
            example:
              event_id: "018f3a3b-3d7f-7b2e-9c5a-1a2b3c4d5e6f"
              event_time: "2024-05-01T14:30:00Z"
              service: "payment-service"
              event_type: "deploy_completed"
              message: "Deployed v1.2.3 to production"
              properties:
                version: "v1.2.3"
                region: "us-east-1"
      responses:
        "201":
          description: Event persisted to disk.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Health endpoints ─────────────────────────────────────────────────

  /live:
    get:
      operationId: liveness
      summary: Liveness probe
      description: Returns 200 if the service process is running. Used by Kubernetes liveness probes.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is alive.
          content:
            text/plain:
              schema:
                type: string
                example: up

  /ready:
    get:
      operationId: readiness
      summary: Readiness probe
      description: Returns 200 if the service is ready to accept traffic. Checks that the storage sink is initialized.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is ready.
          content:
            text/plain:
              schema:
                type: string
                example: ready
        "503":
          description: Service is not ready (sink not initialized).

  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics
      description: |
        Returns Prometheus-formatted metrics including ingestion_requests_total,
        ingestion_batch_size_bytes, ingestion_fsync_duration_seconds, and
        standard Go runtime metrics.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Prometheus metrics in text exposition format.
          content:
            text/plain:
              schema:
                type: string

  # ── Auth endpoints ───────────────────────────────────────────────────

  /api/gateway/register:
    post:
      operationId: register
      summary: Register a new tenant and user
      description: Creates a new tenant, user account, initial API key, and returns a JWT token.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Tenant and user created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gateway/login:
    post:
      operationId: login
      summary: Authenticate user
      description: Validates credentials and returns a JWT token.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gateway/me:
    get:
      operationId: getMe
      summary: Get current user info
      description: Returns profile information for the authenticated user.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── API Keys endpoints ──────────────────────────────────────────────

  /api/gateway/api-keys:
    get:
      operationId: listAPIKeys
      summary: List API keys
      description: Returns all API keys for the authenticated user's tenant.
      tags: [APIKeys]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createAPIKey
      summary: Create an API key
      description: Creates a new API key. Requires admin or editor role.
      tags: [APIKeys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: API key created. The full key is only returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gateway/api-keys/{id}:
    delete:
      operationId: revokeAPIKey
      summary: Revoke an API key
      description: Revokes an API key by ID. Requires admin role.
      tags: [APIKeys]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: API key ID.
      responses:
        "200":
          description: API key revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Billing endpoints ───────────────────────────────────────────────

  /api/gateway/billing/portal:
    post:
      operationId: billingPortal
      summary: Get Stripe Customer Portal URL
      description: Returns a URL to the Stripe Customer Portal for managing subscriptions.
      tags: [Billing]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Portal URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPortalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gateway/billing/usage:
    get:
      operationId: billingUsage
      summary: Get current usage stats
      description: Returns the current billing period usage for the authenticated tenant.
      tags: [Billing]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usage statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUsageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Stripe Webhook ──────────────────────────────────────────────────

  /api/gateway/webhooks/stripe:
    post:
      operationId: stripeWebhook
      summary: Handle Stripe webhook events
      description: Receives Stripe webhook events. Verified via Stripe signature header, no JWT required.
      tags: [Billing]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe event payload.
      responses:
        "200":
          description: Webhook processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Alert Rules endpoints ───────────────────────────────────────────

  /api/gateway/alert-rules:
    get:
      operationId: listAlertRules
      summary: List alert rules
      description: Returns all alert rules for the authenticated tenant.
      tags: [Alerts]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of alert rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createAlertRule
      summary: Create an alert rule
      description: Creates a new alert rule for the authenticated tenant.
      tags: [Alerts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleInput"
      responses:
        "201":
          description: Alert rule created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gateway/alert-rules/{id}:
    get:
      operationId: getAlertRule
      summary: Get an alert rule
      description: Returns a single alert rule by ID.
      tags: [Alerts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Alert rule ID.
      responses:
        "200":
          description: Alert rule details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateAlertRule
      summary: Update an alert rule
      description: Updates an existing alert rule by ID.
      tags: [Alerts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Alert rule ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleInput"
      responses:
        "200":
          description: Alert rule updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteAlertRule
      summary: Delete an alert rule
      description: Deletes an alert rule by ID.
      tags: [Alerts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Alert rule ID.
      responses:
        "200":
          description: Alert rule deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Notification Channels endpoints ─────────────────────────────────

  /api/gateway/channels:
    get:
      operationId: listChannels
      summary: List notification channels
      description: Returns all notification channels for the authenticated tenant.
      tags: [Channels]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createChannel
      summary: Create a notification channel
      description: Creates a new notification channel.
      tags: [Channels]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: Channel created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gateway/channels/{id}:
    get:
      operationId: getChannel
      summary: Get a notification channel
      description: Returns a single notification channel by ID.
      tags: [Channels]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Channel ID.
      responses:
        "200":
          description: Channel details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateChannel
      summary: Update a notification channel
      description: Updates an existing notification channel by ID.
      tags: [Channels]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Channel ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "200":
          description: Channel updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteChannel
      summary: Delete a notification channel
      description: Deletes a notification channel by ID.
      tags: [Channels]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Channel ID.
      responses:
        "200":
          description: Channel deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Alert History endpoint ──────────────────────────────────────────

  /api/gateway/alert-history:
    get:
      operationId: listAlertHistory
      summary: List alert history
      description: Returns alert firing history. Requires admin role.
      tags: [Alerts]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of entries to return.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of entries to skip.
      responses:
        "200":
          description: Alert history entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── DLQ endpoints ───────────────────────────────────────────────────

  /api/gateway/dlq:
    get:
      operationId: listDLQ
      summary: List dead-letter queue entries
      description: Returns entries from the dead-letter queue.
      tags: [DLQ]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of entries to return.
      responses:
        "200":
          description: DLQ entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gateway/dlq/replay:
    post:
      operationId: replayDLQ
      summary: Replay DLQ entries
      description: Re-ingests selected dead-letter queue entries.
      tags: [DLQ]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DLQReplayRequest"
      responses:
        "200":
          description: Entries replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQReplayResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Audit Log endpoint ─────────────────────────────────────────────

  /api/v1/percentile:
    get:
      operationId: getWindowPercentile
      summary: Percentile over a time window
      description: >
        Returns a quantile computed by merging the t-digest sketches stored with each
        minute bucket.


        This endpoint exists because a percentile has no correct aggregation across
        buckets: the maximum of sixty one-minute p95s is not the hour's p95, and on
        heavy-tailed latency it was measured 94% above the true value. The semantic
        layer therefore exposes the per-bucket percentile columns as non-aggregatable
        and any window wider than one minute is answered here, where the sketches can
        be merged with the same implementation that wrote them.


        The answer is a sketch, not an exact value. `exactness` and `error_bound` in
        the response say so, and the bound is the one published in
        contracts/request_metrics_minute.v2.yaml.
      tags: [Metrics]
      security:
        - gravixKeyAuth: []
        - bearerAuth: []
      parameters:
        - name: metric
          in: query
          schema:
            type: string
            default: request_metrics_minute
            enum: [request_metrics_minute]
          description: The metric to query. Only request_metrics_minute carries sketches.
        - name: quantile
          in: query
          required: true
          schema:
            type: number
            format: double
            # OpenAPI 3.0 spells an exclusive bound as a boolean beside the
            # bound itself; the numeric form is 3.1 syntax and is silently
            # ignored by 3.0 tooling, which would document the wrong range.
            minimum: 0
            exclusiveMinimum: true
            maximum: 1
            exclusiveMaximum: true
            example: 0.95
          description: >
            The quantile, strictly between 0 and 1. The published error bound covers
            [0.5, 0.99]; quantiles outside that range are answered but less accurate.
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Start of the window, inclusive (RFC3339).
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: End of the window, exclusive (RFC3339). At most 31 days after `from`.
        - name: granularity
          in: query
          schema:
            type: string
            enum: [minute, hour, day, all]
            default: all
          description: >
            How to group the window. `all` returns one bucket covering the whole
            window; the others return one per period that has data.
        - name: service
          in: query
          schema:
            type: string
          description: Restrict to one service.
        - name: method
          in: query
          schema:
            type: string
          description: Restrict to one HTTP method.
        - name: path_template
          in: query
          schema:
            type: string
          description: >
            Restrict to one path template. Only the three declared dimensions are
            accepted; high-cardinality filters are a stated non-goal.
      responses:
        "200":
          description: The merged quantile for each bucket that has data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PercentileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/PreSketchPartition"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >
            Metric storage is not configured, so no sketch can be read. The endpoint
            reports this rather than falling back to the per-bucket scalars, which
            would be the wrong number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "metric storage is not configured"
                code: 503

  /api/v1/lineage:
    get:
      operationId: getLineage
      summary: Provenance of one metric value
      description: >
        Returns everything behind a single metric value: the contract that defines
        it, how exact it is, which fact files it was computed from and how many
        facts those held, whether the partition has been revised, and the command
        that rebuilds it.


        This is `gravix explain` over HTTP. The response is assembled by the same
        code the CLI uses, so the two cannot disagree about where a number came
        from.


        It reports aggregates and file names, never individual request records —
        per-request querying is a stated non-goal (docs/04-non-goals.md §5) and no
        parameter or response field here can be used to reach one. Only the three
        declared dimensions are accepted as filters.
      tags: [Metrics]
      security:
        - gravixKeyAuth: []
        - bearerAuth: []
      parameters:
        - name: metric
          in: query
          schema:
            type: string
            default: request_metrics_minute
          description: >
            The rollup name, or one of its contract names (for example
            `latency_p95`). Naming a contract focuses the report on that metric's
            definition; naming the rollup reports the weakest guarantee present,
            because that is the one a reader most needs to know about.
        - name: bucket
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: The `bucket_start` being explained (RFC3339). Matched exactly.
        - name: service
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
        - name: path_template
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The value's full provenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lineage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No partition covers that bucket, or no row matches the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/LineageUnavailable"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Metric storage is not configured, so no partition can be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/gateway/audit-log:
    get:
      operationId: listAuditLog
      summary: List audit log entries
      description: Returns paginated audit log entries. Requires admin role.
      tags: [Audit]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of entries to return.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of entries to skip.
      responses:
        "200":
          description: Audit log entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication. Set via the API_KEY environment variable on the server.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from /api/gateway/login
    gravixKeyAuth:
      type: apiKey
      in: header
      name: X-Gravix-Key
      description: >
        Per-tenant Gravix API key, created via /api/gateway/api-keys. The gateway
        resolves it to a tenant and answers only for that tenant's partitions.
        An `Authorization: Bearer <key>` header is accepted as an alternative.

  schemas:
    # ── Ingestion schemas ────────────────────────────────────────────

    RequestFact:
      type: object
      description: A single HTTP request observation.
      required:
        - event_id
        - event_time
        - service
        - method
        - path_template
        - status_code
        - latency_ms
      properties:
        event_id:
          type: string
          format: uuid
          description: UUIDv7 event identifier.
          example: "018f3a3b-2c5e-7a1d-8b4e-9f0a2c5b3d4e"
        event_time:
          type: string
          format: date-time
          description: ISO 8601 / RFC 3339 timestamp.
          example: "2024-05-01T12:00:00Z"
        service:
          type: string
          description: Service name (non-empty).
          example: "auth-service"
        method:
          type: string
          description: HTTP method.
          enum: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
          example: "POST"
        path_template:
          type: string
          description: |
            URL path with {id} placeholders. Must not contain query parameters,
            raw UUIDs, or numeric IDs with 4+ digits.
          example: "/api/v1/users/{id}"
        status_code:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code.
          example: 200
        latency_ms:
          type: integer
          minimum: 0
          description: Response time in milliseconds.
          example: 125
        user_agent_family:
          type: string
          description: Browser/client family (optional).
          example: "Chrome"

    ServiceEvent:
      type: object
      description: A service lifecycle event.
      required:
        - event_id
        - event_time
        - service
        - event_type
      properties:
        event_id:
          type: string
          format: uuid
          description: UUIDv7 event identifier.
          example: "018f3a3b-3d7f-7b2e-9c5a-1a2b3c4d5e6f"
        event_time:
          type: string
          format: date-time
          description: ISO 8601 / RFC 3339 timestamp.
          example: "2024-05-01T14:30:00Z"
        service:
          type: string
          description: Service name.
          example: "payment-service"
        event_type:
          type: string
          description: "Snake_case event type (pattern: ^[a-z]+(_[a-z0-9]+)*$)."
          example: "deploy_completed"
        entity_id:
          type: string
          description: Related entity identifier (optional).
          example: "deployment/payment-v1.2.3"
        message:
          type: string
          description: Human-readable message (optional).
          example: "Deployed v1.2.3 to production"
        properties:
          type: object
          additionalProperties:
            type: string
            maxLength: 1024
          description: Flat key-value string metadata (optional).
          example:
            version: "v1.2.3"
            region: "us-east-1"

    BatchResult:
      type: object
      description: Result of a batch ingestion request.
      required:
        - accepted
        - rejected
      properties:
        accepted:
          type: integer
          description: Number of facts successfully persisted.
          example: 2
        rejected:
          type: integer
          description: Number of facts that failed validation.
          example: 1
        errors:
          type: array
          items:
            type: string
          description: Validation error messages for rejected facts (omitted when rejected is 0).
          example:
            - "line 3: invalid RequestFact: event_id must be a valid UUIDv7"

    ErrorResponse:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error description.
          example: "validation failed: event_id must be a valid UUIDv7"
        code:
          type: integer
          description: HTTP status code.
          example: 400

    # ── Gateway Auth schemas ─────────────────────────────────────────

    RegisterRequest:
      type: object
      required:
        - tenant_name
        - email
        - password
        - plan
      properties:
        tenant_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        plan:
          type: string

    RegisterResponse:
      type: object
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        api_key:
          type: string
        token:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        tenant_id:
          type: string
        tenant_name:
          type: string
        plan:
          type: string

    # ── API Keys schemas ─────────────────────────────────────────────

    APIKeySummary:
      type: object
      properties:
        id:
          type: string
        key_prefix:
          type: string
        name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    APIKeyListResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/APIKeySummary"

    CreateAPIKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    CreateAPIKeyResponse:
      type: object
      properties:
        key:
          type: string
        key_prefix:
          type: string
        name:
          type: string

    # ── Billing schemas ──────────────────────────────────────────────

    BillingPortalResponse:
      type: object
      properties:
        url:
          type: string
          format: uri

    BillingUsageResponse:
      type: object
      properties:
        today_count:
          type: integer
        plan:
          type: string
        period:
          type: string

    # ── Alert Rules schemas ──────────────────────────────────────────

    AlertRuleInput:
      type: object
      required:
        - name
        - metric
        - operator
        - threshold
        - window_minutes
      properties:
        name:
          type: string
        metric:
          type: string
        operator:
          type: string
        threshold:
          type: number
        window_minutes:
          type: integer
        service:
          type: string
        path_template:
          type: string
        channel_id:
          type: string
        enabled:
          type: boolean

    AlertRule:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        metric:
          type: string
        operator:
          type: string
        threshold:
          type: number
        window_minutes:
          type: integer
        service:
          type: string
        path_template:
          type: string
        channel_id:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlertRuleListResponse:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AlertRule"

    AlertHistoryEntry:
      type: object
      properties:
        id:
          type: string
        rule_id:
          type: string
        rule_name:
          type: string
        metric:
          type: string
        value:
          type: number
        threshold:
          type: number
        fired_at:
          type: string
          format: date-time

    AlertHistoryResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AlertHistoryEntry"
        total:
          type: integer

    # ── Channels schemas ─────────────────────────────────────────────

    ChannelInput:
      type: object
      required:
        - name
        - type
        - config
      properties:
        name:
          type: string
        type:
          type: string
        config:
          type: object
          additionalProperties: true

    Channel:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        type:
          type: string
        config:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChannelListResponse:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"

    # ── DLQ schemas ──────────────────────────────────────────────────

    DLQEntry:
      type: object
      properties:
        id:
          type: string
        payload:
          type: object
        error:
          type: string
        created_at:
          type: string
          format: date-time

    DLQListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DLQEntry"

    DLQReplayRequest:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            type: string

    DLQReplayResponse:
      type: object
      properties:
        replayed:
          type: integer

    # ── Audit Log schemas ────────────────────────────────────────────

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        user_id:
          type: string
        action:
          type: string
        resource:
          type: string
        detail:
          type: string
        created_at:
          type: string
          format: date-time

    AuditLogResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Lineage:
      type: object
      description: >
        The full provenance of one metric value. Every field that qualifies the
        number travels with it — a number whose exactness you have to look up
        somewhere else is a number nobody checks.
      required:
        - metric
        - metric_version
        - contract_ref
        - bucket
        - values
        - formula
        - grain
        - exactness
        - mergeability
        - data_file
        - idempotency_key
        - content_digest
        - source_fact_keys
        - fact_count
        - recompute_cmd
      properties:
        metric:
          type: string
          example: request_metrics_minute
        metric_version:
          type: string
          example: v2
        contract_ref:
          type: string
          description: >
            The contract whose formula, exactness and mergeability are reported. It
            differs from `metric` when a rollup was asked about: a rollup is several
            metrics, so one of their contracts has to be the one described, and the
            reader is entitled to know which.
          example: latency_p95@v2
        bucket:
          type: string
          format: date-time
        filters:
          type: object
          additionalProperties:
            type: string
          description: The dimension filters that selected the row. Never more than the three declared dimensions.
        values:
          type: object
          description: Every measure in the row. Aggregates only.
          additionalProperties: true
        formula:
          type: string
          example: percentile(latency_ms, 0.95) within bucket
        grain:
          type: string
          example: minute
        exactness:
          type: string
          enum: [exact, sketch, approximate]
        error_bound:
          type: string
        mergeability:
          type: string
          enum: [sum, weighted_mean, sketch_merge, none]
        merge_note:
          type: string
        known_defect:
          type: string
          description: >
            Present when `exactness` is `approximate`. The contract registry refuses
            to load an approximate metric that does not declare one, so an
            undisclosed approximation cannot ship.
        data_file:
          type: string
          description: The object key of the Parquet partition the row was read from.
        idempotency_key:
          type: string
          example: "request_metrics_minute:v2::20260909"
        content_digest:
          type: string
          description: >
            A sha256 over the partition's canonicalised rows, not over the Parquet
            container — so it is stable across writer versions and compression
            settings, and changes only when a published number changes.
          example: "sha256:9fccad8ddd3ad6ee438b5d5df40d6e2262f7f748f107ada14723ed414b63990b"
        source_fact_keys:
          type: array
          description: The fact **files** the partition was built from. Never fact records.
          items:
            type: string
        fact_count:
          type: integer
          format: int64
          description: Facts read for the whole partition, not just the filtered row.
        current_revision:
          type: integer
          description: 0 for a partition whose published numbers have never changed.
        revision_history:
          type: array
          items:
            $ref: "#/components/schemas/LineageRevision"
        recompute_cmd:
          type: string
          description: A command that rebuilds this partition from its facts.

    LineageRevision:
      type: object
      properties:
        number:
          type: integer
        digest:
          type: string
        revised_at:
          type: string
          format: date-time

    PercentileResponse:
      type: object
      description: >
        A quantile answered by merging stored sketches. Every field that qualifies
        the number — its exactness, its error bound, and how many sketches went into
        it — is part of the response, not documentation someone has to go and find.
      required: [metric, quantile, granularity, exactness, error_bound, buckets]
      properties:
        metric:
          type: string
          example: request_metrics_minute
        quantile:
          type: number
          format: double
          example: 0.95
        granularity:
          type: string
          enum: [minute, hour, day, all]
          example: hour
        exactness:
          type: string
          enum: [sketch]
          description: >
            Always `sketch` here. The value is an approximation with a published
            bound, never an exact order statistic over the raw facts.
        error_bound:
          type: string
          description: The bound published by the metric contract, stated in the response.
          example: "relative error <= 1% for q in [0.5, 0.99]"
        buckets:
          type: array
          description: One entry per period that had data. Empty when nothing matched.
          items:
            $ref: "#/components/schemas/PercentileBucket"

    PercentileBucket:
      type: object
      required: [bucket_start, value, observations, sketches_merged]
      properties:
        bucket_start:
          type: string
          format: date-time
          description: Start of this bucket, UTC. For granularity `all`, the window start.
          example: "2026-09-09T14:00:00Z"
        value:
          type: number
          format: double
          description: The quantile in the metric's own unit (milliseconds for latency).
          example: 142.3
        observations:
          type: integer
          format: int64
          description: Requests represented by the merged sketches.
          example: 72240
        sketches_merged:
          type: integer
          description: >
            How many per-minute sketches were merged. A low count against a wide
            window means the window is mostly empty.
          example: 60

  responses:
    BadRequest:
      description: Validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "validation failed: path_template contains raw UUID"
            code: 400

    Unauthorized:
      description: Missing or invalid API key or JWT token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "unauthorized"
            code: 401

    Forbidden:
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "forbidden: admin role required"
            code: 403

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "not found"
            code: 404

    LineageUnavailable:
      description: >
        The partition exists and its data is fine, but its provenance was never
        recorded — it was written before manifests existed. This is a recoverable
        state rather than a failure, which is why it has its own status code and
        its own body: the response carries the command that records it.
      content:
        application/json:
          schema:
            type: object
            required: [error, reason, recompute_cmd]
            properties:
              error:
                type: string
                enum: [lineage_unavailable]
              reason:
                type: string
                example: partition predates manifests
              recompute_cmd:
                type: string
                example: "gravix recompute --metric request_metrics_minute --from 2026-09-09 --to 2026-09-10"

    PreSketchPartition:
      description: >
        A partition in the requested window predates sketch storage, so the window
        cannot be answered correctly. The days are named so `gravix recompute` can
        rebuild them. This is deliberately an error rather than a silent fallback to
        the per-bucket scalars.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "partitions 2026-09-01, 2026-09-02 predate sketch storage; run gravix recompute for those days"
            code: 422

    PayloadTooLarge:
      description: Request body exceeds 1 MB limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "request body too large (max 1MB)"
            code: 413

    RateLimited:
      description: Rate limit exceeded (100 req/s, burst 200).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "rate limit exceeded, try again later"
            code: 429

    GatewayRateLimited:
      description: Per-tenant rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "rate limit exceeded, try again later"
            code: 429
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests allowed per window.
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in the current window.
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when the rate limit window resets.

    InternalError:
      description: Internal server error (disk write or marshal failure).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "internal server error"
            code: 500
