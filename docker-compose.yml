version: '3.8'

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gravix-gateway
    restart: always
    ports:
      - "8091:8091"
    volumes:
      - ./data:/app/data
    command: [ "./gateway", "--tenant-db", "/app/data/gravix.db" ]
    environment:
      - JWT_SECRET=supersecretjwtkey12345!
      - TENANT_DB_PATH=/app/data/gravix.db
      - CUBE_API_URL=http://cube:4000/cubejs-api/v1/load
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8091/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5
    networks:
      - frontend
      - backend

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: gravix-ingestion
    restart: always
    ports:
      - "8090:8080"
    volumes:
      - ./data:/app/data
    command: [ "./ingestion-service", "--base-dir", "/app/data" ]
    environment:
      - TENANT_DB_PATH=/app/data/gravix.db
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-gravix}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - backend

  init-minio:
    image: minio/mc:RELEASE.2024-03-13T23-51-57Z
    container_name: gravix-init-minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/gravix;
      exit 0;
      "
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - set it in .env}
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    networks:
      - backend

  init-trino:
    image: trinodb/trino:351
    container_name: gravix-init-trino
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for Trino to accept connections..."
        until trino --server trino:8080 --execute "SELECT 1" 2>/dev/null; do
          sleep 5
        done
        echo "Trino is ready. Creating schema and tables..."
        trino --server trino:8080 --execute "CREATE SCHEMA IF NOT EXISTS gravix.raw"
        trino --server trino:8080 --execute "
          CREATE TABLE IF NOT EXISTS gravix.raw.request_metrics_minute (
            bucket_start VARCHAR,
            service VARCHAR,
            method VARCHAR,
            path_template VARCHAR,
            request_count BIGINT,
            error_count BIGINT,
            error_rate DOUBLE,
            p50_latency_ms DOUBLE,
            p95_latency_ms DOUBLE,
            p99_latency_ms DOUBLE,
            event_day VARCHAR
          ) WITH (
            format = 'PARQUET',
            external_location = 's3a://gravix/warehouse/request_metrics_minute/'
          )"
        trino --server trino:8080 --execute "
          CREATE TABLE IF NOT EXISTS gravix.raw.service_events_daily (
            event_day VARCHAR,
            service VARCHAR,
            event_type VARCHAR,
            event_count BIGINT
          ) WITH (
            format = 'PARQUET',
            external_location = 's3a://gravix/warehouse/service_events_daily/'
          )"
        echo "Trino tables initialized."
    depends_on:
      trino:
        condition: service_started
    mem_limit: 512m
    cpus: 0.25
    networks:
      - backend

  trino:
    image: trinodb/trino:351
    container_name: gravix-trino
    ports:
      - "127.0.0.1:8081:8080" # Trino UI — localhost only
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?S3_ACCESS_KEY is required - set it in .env}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?S3_SECRET_KEY is required - set it in .env}
    volumes:
      - ./storage/trino/config:/etc/trino
      - ./storage/trino/catalog:/etc/trino/catalog.tpl:ro
      - ./data/trino-metastore:/data/metastore
      - ./data/raw:/data/raw:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/trino/catalog
        for f in /etc/trino/catalog.tpl/*; do
          sed -e "s|\$${S3_ACCESS_KEY}|$$S3_ACCESS_KEY|g" \
              -e "s|\$${S3_SECRET_KEY}|$$S3_SECRET_KEY|g" \
              "$$f" > "/etc/trino/catalog/$$(basename $$f)"
        done
        exec /usr/lib/trino/bin/run-trino
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    mem_limit: 3g
    cpus: 1.0
    networks:
      - backend

  cube:
    image: cubejs/cube:v0.35
    container_name: gravix-cube
    ports:
      - "4000:4000"
    environment:
      - CUBEJS_DB_TYPE=trino
      - CUBEJS_DB_HOST=gravix-trino
      - CUBEJS_DB_PORT=8080
      - CUBEJS_DB_PRESTO_CATALOG=gravix
      - CUBEJS_DB_NAME=raw
      - CUBEJS_DB_USER=trino
      - CUBEJS_DEV_MODE=${CUBEJS_DEV_MODE:-false}
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET:-}
      - TENANT_DB_PATH=/cube/data/gravix.db
      - JWT_SECRET=supersecretjwtkey12345!
    volumes:
      - ./cube/cube.js:/cube/conf/cube.js
      - ./cube/model:/cube/conf/model
      - ./data:/cube/data:ro
    depends_on:
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:4000/readyz', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - frontend
      - backend

  dashboard:
    image: nginx:1.25-alpine
    container_name: gravix-dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./dashboards:/usr/share/nginx/html:ro
      - ./storage/dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      cube:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    networks:
      - frontend

  load-generator:
    build:
      context: .
      dockerfile: services/load_generator/Dockerfile
    container_name: gravix-load-generator
    command: ["./load-generator", "--target", "http://ingestion:8080/api/v1/facts", "--qps", "5", "--concurrency", "2"]
    environment:
      - API_KEY=${API_KEY}
    depends_on:
      ingestion:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    networks:
      - backend

  request-metrics-rollup:
    build:
      context: .
      dockerfile: services/rollup/Dockerfile
    container_name: gravix-request-rollup
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Starting request-metrics rollup cron (every 5 minutes)..."
        while true; do
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Running request-metrics rollup..."
          ./request-metrics-rollup \
            -input-dir ./data/raw/request_facts \
            -output-dir ./data/warehouse/request_metrics_minute || echo "Rollup failed, will retry next cycle"
          sleep 300
        done
    volumes:
      - ./data:/app/data
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-gravix}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    networks:
      - backend

  service-events-rollup:
    build:
      context: .
      dockerfile: services/rollup/Dockerfile
    container_name: gravix-events-rollup
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Starting service-events rollup cron (every hour)..."
        while true; do
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Running service-events rollup..."
          ./service-events-rollup \
            -input-dir ./data/raw/service_events \
            -output-dir ./data/warehouse/service_events_daily || echo "Rollup failed, will retry next cycle"
          sleep 3600
        done
    volumes:
      - ./data:/app/data
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-gravix}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    networks:
      - backend

  purge:
    build:
      context: .
      dockerfile: services/rollup/Dockerfile
    container_name: gravix-purge
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Starting purge cron (daily at 03:00 UTC)..."
        while true; do
          CURRENT_HOUR=$(date -u +%H)
          if [ "$$CURRENT_HOUR" = "03" ]; then
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Running data purge (30-day retention)..."
            ./purge --retention-days 30 --data-dir /app/data || echo "Purge failed"
            sleep 3600
          fi
          sleep 1800
        done
    volumes:
      - ./data:/app/data
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-gravix}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: gravix-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./storage/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    ports:
      - "127.0.0.1:9090:9090" # localhost only
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 512m
    cpus: 0.5
    networks:
      - backend

  grafana:
    image: grafana/grafana:10.4.0
    container_name: gravix-grafana
    ports:
      - "127.0.0.1:3000:3000" # localhost only
    volumes:
      - ./storage/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: gravix-minio
    ports:
      - "127.0.0.1:9000:9000"  # localhost only
      - "127.0.0.1:9001:9001"  # localhost only
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - set it in .env}
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - backend
