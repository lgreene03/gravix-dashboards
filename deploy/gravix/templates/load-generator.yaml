{{- if .Values.loadGenerator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-load-generator
  labels:
    app: load-generator
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.loadGenerator.replicaCount }}
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      serviceAccountName: {{ .Release.Name }}-load-generator
      {{- include "gravix.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: load-generator
          image: {{ include "gravix.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.loadGenerator.image.repository "tag" .Values.loadGenerator.image.tag) | quote }}
          imagePullPolicy: {{ .Values.loadGenerator.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["./load-generator"]
          args:
            - "--target"
            - "http://{{ .Release.Name }}-ingestion:{{ .Values.ingestion.service.port }}/api/v1/facts"
            - "--qps"
            - "{{ .Values.loadGenerator.config.qps }}"
            - "--concurrency"
            - "{{ .Values.loadGenerator.config.concurrency }}"
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: api-key
{{- end }}
