{{- if and .Values.storage.trino.enabled .Values.storage.trino.workers.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-trino-worker
  labels:
    app.kubernetes.io/name: gravix
    app.kubernetes.io/component: trino-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.storage.trino.workers.replicaCount | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gravix
      app.kubernetes.io/component: trino-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gravix
        app.kubernetes.io/component: trino-worker
    spec:
      containers:
        - name: trino-worker
          image: "{{ .Values.storage.trino.image.repository }}:{{ .Values.storage.trino.image.tag }}"
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: trino-config
              mountPath: /etc/trino/config.properties
              subPath: worker-config.properties
            - name: trino-config
              mountPath: /etc/trino/node.properties
              subPath: node.properties
            - name: trino-catalog
              mountPath: /etc/trino/catalog/hive.properties
              subPath: hive.properties
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.storage.trino.workers.resources | nindent 12 }}
      volumes:
        - name: trino-config
          configMap:
            name: {{ .Release.Name }}-trino-worker-config
        - name: trino-catalog
          configMap:
            name: {{ .Release.Name }}-trino-catalog
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-trino-worker-config
  labels:
    app.kubernetes.io/name: gravix
    app.kubernetes.io/component: trino-worker
data:
  worker-config.properties: |
    coordinator=false
    http-server.http.port=8080
    discovery.uri=http://{{ .Release.Name }}-trino:8080
    node-scheduler.include-coordinator=false
  node.properties: |
    node.environment=production
    node.id=${NODE_ID}
    node.data-dir=/data/trino
{{- end }}
