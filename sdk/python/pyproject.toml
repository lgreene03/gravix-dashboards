[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravix"
version = "0.1.0"
description = "Python SDK for Gravix observability platform"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "urllib3>=2.0",
]

[project.optional-dependencies]
flask = ["flask>=2.0"]
fastapi = ["fastapi>=0.100", "starlette>=0.27"]
dev = ["pytest>=7.0", "responses>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
