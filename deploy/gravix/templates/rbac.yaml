{{/*
  RBAC roles enforce least-privilege secret access.
  Each service account can only read the specific secret keys it needs.
  This prevents lateral movement if a pod is compromised.

  Note: These roles grant access to the Gravix secret object only.
  automountServiceAccountToken is false on all SAs, so pods cannot
  use the K8s API unless explicitly overridden.
*/}}

# ─── Ingestion: needs api-key + s3 credentials ───
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-ingestion-secrets
  labels:
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Release.Name }}-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-ingestion-secrets
  labels:
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-ingestion-secrets
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-ingestion

