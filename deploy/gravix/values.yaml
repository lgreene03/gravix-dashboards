# Default values for gravix.
# This is a YAML-formatted file.

global:
  # REQUIRED: Override these in a separate values file or --set flags.
  # Deploy will fail if these are left empty.
  apiKey: ""
  jwtSecret: ""      # REQUIRED: JWT signing secret (min 32 chars)
  cubeApiSecret: ""   # REQUIRED: Cube.js API secret
  databaseUrl: ""     # PostgreSQL connection string (when gateway.dbDriver=postgres)

  # Container registry configuration.
  # For GHCR: ghcr.io/<org>/gravix
  # For ECR:  <account>.dkr.ecr.<region>.amazonaws.com/gravix
  imageRegistry: ""

  # Pull secrets for private registries.
  # Create with: kubectl create secret docker-registry gravix-registry \
  #   --docker-server=ghcr.io --docker-username=<user> --docker-password=<token>
  imagePullSecrets: []
  #  - name: gravix-registry

  storage:
    endpoint: "http://gravix-minio:9000"
    region: "us-east-1"
    bucket: "gravix"
    accessKey: ""
    secretKey: ""

# External Secrets Operator integration.
# When enabled, secrets are pulled from an external provider (AWS Secrets Manager,
# HashiCorp Vault, GCP Secret Manager) instead of being passed via Helm values.
# Requires: External Secrets Operator installed in the cluster.
externalSecrets:
  enabled: false
  # refreshInterval: "1h"        # How often to sync secrets from the provider
  # secretStoreRef:
  #   name: "gravix-secret-store" # Name of the ClusterSecretStore/SecretStore
  #   kind: "ClusterSecretStore"
  # remoteBase: "gravix/prod"     # Base path/prefix in the secret provider
  # property: false               # Set true if secrets are stored as JSON properties in a single key

# Network policy enforcement. Requires a CNI that supports NetworkPolicy
# (Calico, Cilium, etc.). Safe to enable — no-op if CNI doesn't support it.
networkPolicies:
  enabled: false

ingestion:
  enabled: true
  replicaCount: 1
  image:
    repository: gravix-ingestion
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  persistence:
    enabled: true
    size: 1Gi
    mountPath: /app/data
    # storageClass: ""  # Use cluster default if empty. Set to "gp3" (AWS), "pd-ssd" (GCP), etc.

loadGenerator:
  enabled: true
  replicaCount: 1
  image:
    repository: gravix-load-generator
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  config:
    qps: 5
    concurrency: 2

rollupJob:
  enabled: true
  image:
    repository: gravix-rollup
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  schedule: "*/5 * * * *" # Every 5 minutes

eventsRollupJob:
  enabled: true
  schedule: "0 * * * *"  # Every hour

eventsDetailJob:
  enabled: true
  schedule: "0 * * * *"  # Every hour

retentionJob:
  enabled: true
  image:
    repository: gravix-rollup
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  schedule: "0 3 * * *" # Daily at 03:00 UTC
  mode: "manual"        # "auto" = per-plan retention (free=7d, starter=30d, pro=90d), "manual" = use retentionDays
  retentionDays: 30     # Only used when mode=manual
  warmAfterDays: 7      # Move data to warm (STANDARD_IA) after this many days (0=disabled)
  coldAfterDays: 30     # Move data to cold (GLACIER) after this many days (0=disabled)
  tenantDBPath: "/data/gravix.db"  # Path to tenant SQLite database inside the container

# S3 lifecycle policy configuration.
# When enabled, creates a ConfigMap with lifecycle rules for the S3 bucket.
# These are applied to the bucket via the MinIO/S3 API or IaC tooling.
s3Lifecycle:
  enabled: false
  warmAfterDays: 7      # Transition to STANDARD_IA after N days
  coldAfterDays: 30     # Transition to GLACIER after N days
  deleteAfterDays: 90   # Permanently delete after N days

gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: gravix-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  tenantDBPath: "/data/gravix.db"
  # Database driver: "sqlite" (default) or "postgres"
  # When "postgres", set database.url in secrets
  dbDriver: "sqlite"
  stripe:
    enabled: false
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  persistence:
    enabled: true
    size: 1Gi
    # storageClass: ""  # Use cluster default if empty

dashboard:
  image:
    repository: nginx
    tag: "1.25-alpine"

storage:
  minio:
    enabled: true
    image:
      repository: minio/minio
      tag: "RELEASE.2024-03-15T01-07-19Z"
    persistence:
      enabled: true
      size: 100Gi
      # storageClass: ""  # Use cluster default if empty
  trino:
    enabled: true
    image:
      repository: trinodb/trino
      tag: "351"
    workers:
      enabled: false
      replicaCount: 2
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: 500m
          memory: 1Gi
  cube:
    enabled: true
    devMode: false  # Set to true only for local development
    image:
      repository: cubejs/cube
      tag: "v0.35"
    hpa:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPU: 70

# Synthetic monitoring CronJob — sends health checks to verify the pipeline.
syntheticMonitor:
  enabled: false
  schedule: "*/5 * * * *"  # every 5 minutes

# cert-manager ClusterIssuer for automatic TLS certificates.
# Requires: cert-manager installed in the cluster.
# See: https://cert-manager.io/docs/installation/
certManager:
  enabled: false
  # email: ""                     # REQUIRED when enabled — Let's Encrypt contact email
  # issuerName: "letsencrypt-prod" # Name of the ClusterIssuer to create
  # solver: []                    # Custom ACME solver config (defaults to HTTP-01 via ingress)

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gravix.local
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
        - path: /api
          pathType: Prefix
          service: ingestion
  tls: []

# Monitoring and observability.
# Requires: Prometheus Operator (kube-prometheus-stack) installed in the cluster.
# Without the operator, pods still expose /metrics via annotation-based scraping.
monitoring:
  # ServiceMonitor CRDs — auto-discovered by Prometheus Operator
  serviceMonitor:
    enabled: false
    # interval: "15s"                # Scrape interval
    # scrapeTimeout: "10s"           # Scrape timeout
    # labels: {}                     # Additional labels for Prometheus selector matching
    # metricRelabelings: []          # Metric relabeling rules

  # PrometheusRule CRD — alert rules managed by Prometheus Operator
  prometheusRule:
    enabled: false
    # labels: {}                     # Additional labels for Prometheus selector matching

  # Grafana dashboard provisioning via ConfigMap
  grafana:
    dashboards:
      enabled: false
      # annotations: {}              # Extra annotations for the dashboard ConfigMap

# Log aggregation (Loki + Promtail).
# Requires: Loki and Promtail images available.
logging:
  loki:
    enabled: false
    image:
      repository: grafana/loki
      tag: "2.9.4"
    persistence:
      size: 10Gi
  promtail:
    image:
      repository: grafana/promtail
      tag: "2.9.4"

# Alertmanager for alert routing (Slack, PagerDuty, email).
alertmanager:
  enabled: false
  image:
    repository: prom/alertmanager
    tag: "v0.27.0"
  # receivers:
  #   - name: slack
  #     slack_configs:
  #       - api_url: "https://hooks.slack.com/services/..."
  #         channel: "#alerts"

# Database backup CronJob.
# SQLite: copies the .db file. PostgreSQL: runs pg_dump.
dbBackup:
  enabled: false
  schedule: "0 1 * * *"  # Daily at 01:00 UTC
  retentionDays: 7

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Namespace resource limits. Enable in production to prevent runaway consumption.
resourceQuota:
  enabled: false
  cpu: "4"            # Total CPU requests across all pods
  memory: "8Gi"       # Total memory requests across all pods
  limitsCpu: "8"      # Total CPU limits
  limitsMemory: "16Gi"  # Total memory limits
  pvcs: "5"           # Max PersistentVolumeClaims
  pods: "30"          # Max pods in namespace

# S3/MinIO data backup. Creates point-in-time snapshots of raw/ and warehouse/
# prefixes. Backups are stored in the same bucket under a backups/ prefix
# (or in a separate destinationBucket for cross-region DR).
backup:
  enabled: false
  schedule: "0 2 * * *"          # Daily at 02:00 UTC (before retention at 03:00)
  retentionDays: 7               # Keep backup snapshots for 7 days
  # prefix: "backups"            # S3 prefix for backup snapshots
  # destinationBucket: ""        # Separate bucket for cross-region DR
  # activeDeadlineSeconds: 3600  # Max runtime for backup job
