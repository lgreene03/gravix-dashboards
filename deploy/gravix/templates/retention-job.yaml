{{- if .Values.retentionJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-retention
  labels:
    app: retention
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.retentionJob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9090"
            prometheus.io/path: "/metrics"
        spec:
          serviceAccountName: {{ .Release.Name }}-jobs
          {{- include "gravix.imagePullSecrets" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: purge
              image: {{ include "gravix.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.retentionJob.image.repository "tag" .Values.retentionJob.image.tag) | quote }}
              imagePullPolicy: {{ .Values.retentionJob.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["./purge"]
              args:
                - "--retention-days"
                - "{{ .Values.retentionJob.retentionDays }}"
              env:
                - name: S3_ENDPOINT
                  value: {{ .Values.global.storage.endpoint | quote }}
                - name: S3_REGION
                  value: {{ .Values.global.storage.region | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.global.storage.bucket | quote }}
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: s3-access-key
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: s3-secret-key
              resources:
                limits:
                  cpu: 250m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
          restartPolicy: OnFailure
{{- end }}
