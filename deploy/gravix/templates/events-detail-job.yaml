{{- if .Values.eventsDetailJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-events-detail
  labels:
    app: events-detail
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.eventsDetailJob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9093"
            prometheus.io/path: "/metrics"
        spec:
          serviceAccountName: {{ .Release.Name }}-jobs
          {{- include "gravix.imagePullSecrets" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: events-detail
              image: {{ include "gravix.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.rollupJob.image.repository "tag" .Values.rollupJob.image.tag) | quote }}
              imagePullPolicy: {{ .Values.rollupJob.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["./service-events-detail-rollup"]
              env:
                - name: S3_ENDPOINT
                  value: {{ .Values.global.storage.endpoint | quote }}
                - name: S3_REGION
                  value: {{ .Values.global.storage.region | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.global.storage.bucket | quote }}
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: s3-access-key
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: s3-secret-key
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
          restartPolicy: OnFailure
{{- end }}
