#
# v2 percentiles: computed from a mergeable t-digest sketch rather than from a
# per-bucket scalar.
#
# v1 answered a single bucket exactly and had no correct answer for a window of
# many buckets — the Cube model took the MAX of the per-minute values, which is not
# a percentile and whose error was unbounded. On a pareto latency distribution that
# MAX was 62% above the true p95. v2's merged sketch was 0.3% from it.
#
# The v1 contracts are deprecated, not edited: they remain the published record of
# what v1 numbers meant.

contracts:
  - name: latency_p50
    version: v2
    title: Median latency (p50)
    formula: 50th percentile of latency_ms, from the merged latency_sketch over the queried window
    input_facts:
      - RequestFact
    input_fields:
      - event_time
      - service
      - method
      - path_template
      - latency_ms
    grain: 1 minute, per service/method/path_template
    dimensions:
      - tenant_id
      - service
      - method
      - path_template
    exactness: sketch
    error_bound: >-
      RANK error <= 1% at q in [0.5, 0.99]: the value returned sits within 1% of the
      requested quantile's true rank. That is the guarantee a t-digest makes, and it holds
      regardless of distribution or window size — measured worst 0.09% over 24,000
      observations end to end (TestMergeabilityEndToEnd).
      VALUE error is not bounded by it and depends on how many observations the window
      holds and how heavy the tail is, because one observation of rank error at q=0.99
      can be an order of magnitude in value, and integer-millisecond latencies make a
      sub-millisecond difference read as several percent at a small median. Measured worst
      relative value error across uniform, normal, lognormal, bimodal and pareto
      (TestSketchErrorIsAFunctionOfSampleSize): n=100 -> 157%, n=1,000 -> 17%,
      n=10,000 -> 5.8%, n=100,000 -> 0.8%. Below roughly 10,000 observations in the
      queried window, treat the value as indicative rather than accurate.
      This supersedes an earlier claim of a flat "relative error <= 1%", which was
      measured only at 1e6 observations and does not hold at realistic bucket sizes.
      See CD-001.
    mergeability: sketch_merge
    merge_note: >-
      Merge the latency_sketch column across buckets, then query the quantile. Never
      take max, mean, or any other function of the per-bucket scalar percentiles —
      that is what v1 did and it is why v1 is deprecated. Merging is exact: it is a
      multiset union of centroids, so any grouping or ordering of the buckets gives
      the same answer.
    late_data: >-
      The bucket is recomputed from all of its facts, sketch included, so a late fact
      shifts the quantile to its correct value rather than being folded into a stale
      summary.
    supersedes: latency_p50@v1
    recompute_cmd: gravix recompute --metric request_metrics_minute --from 2026-09-01 --to 2026-09-02

