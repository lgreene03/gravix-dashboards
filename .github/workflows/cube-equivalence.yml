name: cube-equivalence

# Before Cube's version changes, the same questions asked of the same warehouse
# must get the same answers. F-060 found the pinned Cube stalls on concurrent
# first queries and a later one does not; this is the other half of the case
# for upgrading. Each job starts a stack on the pinned Cube, waits for data,
# stops everything that writes, asks scripts/cube_equivalence.py's queries,
# swaps only the Cube container for the candidate, asks again, and compares.
# `bootstrap` measures Cube on DuckDB and `full` measures it on Trino, which is
# also what the Helm chart runs. Dispatched by hand: a measurement, not a gate.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Cube image to compare with the pinned one
        required: true
        default: cubejs/cube:v1.7.48

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.bootstrap.yml
    steps:
      - uses: actions/checkout@v4

      - name: Start the bootstrap stack on the pinned Cube
        run: |
          docker compose up -d --build
          docker inspect -f '{{.Config.Image}}' gravix-cube
          for _ in $(seq 1 120); do
            curl -sf http://localhost:4000/readyz >/dev/null 2>&1 \
              && curl -sf http://localhost:8091/live >/dev/null 2>&1 && exit 0
            sleep 5
          done
          docker compose ps -a
          exit 1

      # Wait for a metrics file, not the directory: the rollup creates the
      # directory before it has written anything, and stopping the writers
      # then leaves Cube nothing to read. The tenant the dashboard's queries
      # are scoped to is the directory the file sits under.
      - name: Wait for a rollup, then stop everything that writes
        run: |
          file=""
          for _ in $(seq 1 80); do
            file="$(docker compose exec -T gateway find /app/data/warehouse \
              -path '*/request_metrics_minute/*' -name '*.parquet' 2>/dev/null | head -1 || true)"
            [ -n "$file" ] && break
            sleep 10
          done
          [ -n "$file" ] || { echo "::error::no metrics Parquet within the wait"; exit 1; }
          echo "first metrics file: $file"
          tenant="$(printf '%s' "$file" | sed -n 's|^/app/data/warehouse/\([^/]*\)/request_metrics_minute/.*|\1|p')"
          [ -n "$tenant" ] || { echo "::error::could not read a tenant from $file"; exit 1; }
          echo "TENANT_ID=$tenant" >> "$GITHUB_ENV"
          # The event rollups run every five minutes too (F-071). Give both
          # event tables up to six minutes, so the comparison covers their
          # cubes; a run without them still compares the metrics.
          n=0
          for _ in $(seq 1 36); do
            n="$(docker compose exec -T gateway sh -c \
              'for t in service_events_detail service_events_daily; do find /app/data/warehouse -path "*/$t/*" -name "*.parquet" | head -1; done' \
              2>/dev/null | grep -c . || true)"
            [ "$n" -ge 2 ] && break
            sleep 10
          done
          echo "event tables with data: $n of 2"
          # Rollups first, so none is cut off by losing its input.
          docker compose stop request-metrics-rollup service-events-rollup service-events-detail-rollup purge synthetic-traffic ingestion

      - name: Ask the pinned Cube
        run: |
          export SECRET="$(docker compose exec -T gateway cat /app/data/jwt_secret.txt | tr -d '[:space:]')"
          python3 scripts/cube_equivalence.py capture "$RUNNER_TEMP/pinned.json"

      - name: Swap Cube for the candidate
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          printf 'services:\n  cube:\n    image: "%s"\n' "$CANDIDATE" > "$RUNNER_TEMP/candidate.yml"
          docker compose -f docker-compose.bootstrap.yml -f "$RUNNER_TEMP/candidate.yml" up -d --no-deps cube
          docker inspect -f '{{.Config.Image}}' gravix-cube
          for _ in $(seq 1 90); do
            curl -sf http://localhost:4000/readyz >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker compose logs --tail=40 cube
          exit 1

      - name: Ask the candidate the same questions
        run: |
          export SECRET="$(docker compose exec -T gateway cat /app/data/jwt_secret.txt | tr -d '[:space:]')"
          read -r from to < <(python3 -c 'import json,sys; print(*json.load(open(sys.argv[1]))["range"])' "$RUNNER_TEMP/pinned.json")
          python3 scripts/cube_equivalence.py capture "$RUNNER_TEMP/candidate.json" --range "$from" "$to"

      - name: Compare
        run: python3 scripts/cube_equivalence.py compare "$RUNNER_TEMP/pinned.json" "$RUNNER_TEMP/candidate.json"

      - name: Keep both captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-equivalence-bootstrap
          path: |
            ${{ runner.temp }}/pinned.json
            ${{ runner.temp }}/candidate.json
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v

  # The full stack's Trino tables read a prefix no job writes (F-070), so this
  # job seeds them with scripts/cube_equivalence.py's fixture rows instead of
  # waiting for a rollup, and asks without a tenant: those tables have no
  # tenant column.
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat > .env <<'ENVEOF'
          API_KEY=equivalence-key-at-least-32-characters-long
          JWT_SECRET=equivalence-jwt-secret-at-least-32-characters
          TOTP_ENCRYPTION_KEY=equivalence-totp-key-at-least-32-characters
          CORS_ALLOWED_ORIGINS=*
          GRAVIX_ENV=development
          MINIO_ROOT_USER=equivalence-minio-admin
          MINIO_ROOT_PASSWORD=equivalence-minio-password-32-chars-long
          S3_ACCESS_KEY=equivalence-minio-admin
          S3_SECRET_KEY=equivalence-minio-password-32-chars-long
          ENVEOF

      - name: Start the full stack on the pinned Cube
        run: |
          docker compose up -d --build
          docker inspect -f '{{.Config.Image}}' gravix-cube
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8081/v1/info 2>/dev/null | grep -q '"starting":false' \
              && [ "$(docker inspect -f '{{.State.Status}}' gravix-init-trino)" = exited ] \
              && curl -sf http://localhost:4000/readyz >/dev/null 2>&1 && break
            sleep 5
          done
          code="$(docker inspect -f '{{.State.ExitCode}} {{.State.Status}}' gravix-init-trino)"
          [ "$code" = "0 exited" ] || { docker compose ps -a; echo "::error::init-trino: $code"; exit 1; }
          curl -sf http://localhost:4000/readyz >/dev/null || { docker compose logs --tail=40 cube; exit 1; }

      - name: Stop everything that writes, then seed the tables
        run: |
          docker compose stop load-generator request-metrics-rollup service-events-rollup \
            service-events-detail-rollup iceberg-sync purge ingestion
          python3 scripts/cube_equivalence.py trino-fixture "$(date -u +%F)" > "$RUNNER_TEMP/fixture.sql"
          docker compose exec -T trino trino --execute "$(cat "$RUNNER_TEMP/fixture.sql")"

      - name: Ask the pinned Cube
        run: |
          export SECRET="$(sed -n 's/^JWT_SECRET=//p' .env)" TENANT_ID=""
          python3 scripts/cube_equivalence.py capture "$RUNNER_TEMP/pinned.json"

      - name: Swap Cube for the candidate
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          printf 'services:\n  cube:\n    image: "%s"\n' "$CANDIDATE" > "$RUNNER_TEMP/candidate.yml"
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/candidate.yml" up -d --no-deps cube
          docker inspect -f '{{.Config.Image}}' gravix-cube
          for _ in $(seq 1 90); do
            curl -sf http://localhost:4000/readyz >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker compose logs --tail=40 cube
          exit 1

      - name: Ask the candidate the same questions
        run: |
          export SECRET="$(sed -n 's/^JWT_SECRET=//p' .env)" TENANT_ID=""
          read -r from to < <(python3 -c 'import json,sys; print(*json.load(open(sys.argv[1]))["range"])' "$RUNNER_TEMP/pinned.json")
          python3 scripts/cube_equivalence.py capture "$RUNNER_TEMP/candidate.json" --range "$from" "$to"

      - name: Compare
        run: python3 scripts/cube_equivalence.py compare "$RUNNER_TEMP/pinned.json" "$RUNNER_TEMP/candidate.json"

      - name: Cube's log on failure
        if: failure()
        run: docker compose logs --no-color --tail=80 cube trino || true

      - name: Keep both captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-equivalence-full
          path: |
            ${{ runner.temp }}/pinned.json
            ${{ runner.temp }}/candidate.json
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v

