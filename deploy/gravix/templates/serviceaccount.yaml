{{/*
  Dedicated ServiceAccounts for each workload.
  Follows least-privilege — no extra permissions beyond pod defaults.
  Extend with RoleBindings if workloads need K8s API access.
*/}}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-ingestion
  labels:
    app: ingestion
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingestion
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    app: dashboard
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-jobs
  labels:
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: jobs
automountServiceAccountToken: false

{{- if .Values.storage.trino.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-trino
  labels:
    app: trino
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: trino
automountServiceAccountToken: false
{{- end }}

{{- if .Values.storage.cube.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cube
  labels:
    app: cube
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cube
automountServiceAccountToken: false
{{- end }}

{{- if .Values.storage.minio.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    app: minio
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage
automountServiceAccountToken: false
{{- end }}

{{- if .Values.loadGenerator.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-load-generator
  labels:
    app: load-generator
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: load-generator
automountServiceAccountToken: false
{{- end }}
