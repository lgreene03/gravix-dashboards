{{/*
  ExternalSecret pulls secrets from an external provider (AWS Secrets Manager,
  HashiCorp Vault, GCP Secret Manager, Azure Key Vault) at runtime.

  Requires: External Secrets Operator installed in the cluster.
    helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace

  When enabled, this replaces the inline Helm Secret (secrets.yaml) — secrets
  are never passed via --set or stored in values files.
*/}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-external-secrets
  labels:
    app.kubernetes.io/name: gravix
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: api-key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteBase }}/api-key
        {{- if .Values.externalSecrets.property }}
        property: api-key
        {{- end }}
    - secretKey: s3-access-key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteBase }}/s3-access-key
        {{- if .Values.externalSecrets.property }}
        property: s3-access-key
        {{- end }}
    - secretKey: s3-secret-key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteBase }}/s3-secret-key
        {{- if .Values.externalSecrets.property }}
        property: s3-secret-key
        {{- end }}
    {{- if .Values.global.cubeApiSecret }}
    - secretKey: cube-api-secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteBase }}/cube-api-secret
        {{- if .Values.externalSecrets.property }}
        property: cube-api-secret
        {{- end }}
    {{- end }}
{{- end }}
