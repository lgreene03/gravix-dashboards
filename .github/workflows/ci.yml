name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: staticcheck ./...

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run tests with race detector
        run: go test ./... -v -race -count=1

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Check schema coverage >= 90%
        run: |
          COVERAGE=$(go test ./schemas/... -cover | grep -oP 'coverage: \K[0-9.]+')
          echo "Schema coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 90" | bc -l)" -eq 1 ]; then
            echo "::error::Schema coverage ${COVERAGE}% is below 90% threshold"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build all binaries
        run: |
          go build -o bin/ingestion-service ./services/ingestion/
          go build -o bin/gateway ./services/gateway/
          go build -o bin/request-metrics-rollup ./transforms/request_metrics_minute/
          go build -o bin/service-events-rollup ./transforms/service_events_daily/
          go build -o bin/service-events-detail-rollup ./transforms/service_events_detail/
          go build -o bin/load-generator ./cmd/load_generator/
          go build -o bin/purge ./cmd/purge/

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart (dev values)
        run: |
          helm lint deploy/gravix \
            --set global.apiKey=test-key-at-least-16ch \
            --set global.storage.accessKey=test-access-key \
            --set global.storage.secretKey=test-secret-at-least-16ch

      - name: Lint Helm chart (prod values)
        run: |
          helm lint deploy/gravix \
            -f deploy/gravix/values-prod.yaml \
            --set global.apiKey=test-key-at-least-16ch \
            --set global.storage.accessKey=test-access-key \
            --set global.storage.secretKey=test-secret-at-least-16ch \
            --set certManager.email=test@example.com

      - name: Template render (dev)
        run: |
          helm template gravix deploy/gravix \
            --set global.apiKey=test-key-at-least-16ch \
            --set global.storage.accessKey=test-access-key \
            --set global.storage.secretKey=test-secret-at-least-16ch \
            > /dev/null

      - name: Template render (prod)
        run: |
          helm template gravix deploy/gravix \
            -f deploy/gravix/values-prod.yaml \
            --set global.apiKey=test-key-at-least-16ch \
            --set global.storage.accessKey=test-access-key \
            --set global.storage.secretKey=test-secret-at-least-16ch \
            --set certManager.email=test@example.com \
            > /dev/null

      - name: Verify resource count (prod)
        run: |
          COUNT=$(helm template gravix deploy/gravix \
            -f deploy/gravix/values-prod.yaml \
            --set global.apiKey=test-key-at-least-16ch \
            --set global.storage.accessKey=test-access-key \
            --set global.storage.secretKey=test-secret-at-least-16ch \
            --set certManager.email=test@example.com \
            2>/dev/null | grep -c '^kind:')
          echo "Production resource count: ${COUNT}"
          if [ "$COUNT" -lt 40 ]; then
            echo "::error::Expected at least 40 resources, got ${COUNT}"
            exit 1
          fi

  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/ingestion/Dockerfile

      - name: Lint rollup Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/rollup/Dockerfile

      - name: Lint load-generator Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/load_generator/Dockerfile

      - name: Lint gateway Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/gateway/Dockerfile

  # ─── Container Image Pipeline (runs only on main branch push) ───
  docker-build:
    runs-on: ubuntu-latest
    needs: [build, docker-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ingestion
            dockerfile: services/ingestion/Dockerfile
          - image: rollup
            dockerfile: services/rollup/Dockerfile
          - image: load-generator
            dockerfile: services/load_generator/Dockerfile
          - image: gateway
            dockerfile: services/gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            # Tag with git SHA (immutable)
            type=sha,prefix=sha-,format=short
            # Tag with semver if a git tag exists
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Tag latest only on default branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Trivy Vulnerability Scanning ───
  image-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      matrix:
        image: [ingestion, rollup, load-generator, gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.image }}.sarif'
          category: 'trivy-${{ matrix.image }}'
