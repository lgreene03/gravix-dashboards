global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "ingestion"
    static_configs:
      - targets: ["ingestion:8080"]

  - job_name: "huginn"
    static_configs:
      - targets: ["host.docker.internal:8083"]
