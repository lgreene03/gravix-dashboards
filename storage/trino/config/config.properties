coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
query.max-memory=1GB
query.max-memory-per-node=800MB
discovery.uri=http://localhost:8080
# Accept clients that speak Presto's protocol headers as well as Trino's.
# Metabase's Trino option is its Presto JDBC driver, which sends X-Presto-*
# and is refused with HTTP 401 without this. Trino's own clients are
# unaffected: each request is answered in the header style it used.
protocol.v1.alternate-header-name=Presto
