# Iceberg read path for Gravix's warehouse — an ADDITIONAL catalog beside
# gravix.properties, which stays the primary and is unchanged.
#
# iceberg.catalog.type=hadoop needs no metastore service. Every table's
# location and its current metadata pointer (version-hint.text plus versioned
# metadata JSON) live inside the warehouse path itself, so any engine given the
# same path and the same S3 credentials reads the same tables.
#
# That is the whole point. The gravix catalog uses hive.metastore=file, which
# is Trino's own embedded format — not a Hive Metastore Thrift service, and not
# readable by Spark. Sharing it was never an option, so Iceberg gets a catalog
# that needs nothing shared at all.
#
# GRVX-1106 §5.1.
connector.name=iceberg
iceberg.catalog.type=hadoop
iceberg.catalog.warehouse=s3a://${S3_BUCKET}/iceberg-warehouse
iceberg.file-format=PARQUET
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=${S3_ACCESS_KEY}
hive.s3.aws-secret-key=${S3_SECRET_KEY}
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false
